org: brissethsurquislla
service: api-web-scraping

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: dev

  memorySize: 1024
  timeout: 30

  iam:
    role: arn:aws:iam::485954395447:role/LabRole

functions:
  scrape_table:
    handler: scrap_table.lambda_handler

    package:
      patterns:
        - './**'

    events:
      - http:
          path: /scrape/table
          method: get
          cors: true

resources:
  Resources:
    TablaSismosIGP:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: TablaSismosIGP

        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S

        KeySchema:
          - AttributeName: id
            KeyType: HASH

        BillingMode: PAY_PER_REQUEST
